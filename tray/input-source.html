<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' data: blob:; object-src 'none'; base-uri 'none'">
    <title>DicTray Input Source</title>
    <style>
      :root {
        --bg: #07111a;
        --panel: rgba(12, 24, 36, 0.96);
        --panel-strong: rgba(18, 34, 48, 0.98);
        --border: rgba(150, 210, 255, 0.14);
        --border-strong: rgba(77, 240, 165, 0.34);
        --text: #f4fbff;
        --text-soft: rgba(210, 228, 239, 0.74);
        --accent: #4df0a5;
        --accent-soft: rgba(77, 240, 165, 0.16);
        --level-bg: rgba(255, 255, 255, 0.08);
        --shadow: rgba(0, 0, 0, 0.34);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(circle at top left, rgba(79, 170, 255, 0.12), transparent 32%),
          linear-gradient(180deg, #07111a, #050c13 72%);
        color: var(--text);
        font-family: "Aptos", "Bahnschrift", "Segoe UI Variable Text", "Segoe UI", sans-serif;
      }

      body {
        padding: 18px;
      }

      .shell {
        display: grid;
        grid-template-rows: auto auto 1fr;
        gap: 14px;
        width: 100%;
        height: 100%;
      }

      .hero {
        display: grid;
        gap: 6px;
      }

      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--text-soft);
      }

      .title {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .subtitle {
        font-size: 13px;
        line-height: 1.4;
        color: var(--text-soft);
      }

      .status {
        min-height: 40px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text-soft);
        font-size: 12px;
        line-height: 1.4;
      }

      .list {
        min-height: 0;
        overflow: auto;
        display: grid;
        gap: 10px;
        padding-right: 4px;
      }

      .source {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--panel);
        padding: 12px 12px 11px;
        text-align: left;
        color: inherit;
        cursor: pointer;
        box-shadow: 0 14px 24px var(--shadow);
        transition: border-color 120ms ease, transform 120ms ease, background 120ms ease;
      }

      .source:hover {
        transform: translateY(-1px);
        background: var(--panel-strong);
      }

      .source[data-selected="true"] {
        border-color: var(--border-strong);
        background:
          linear-gradient(180deg, rgba(77, 240, 165, 0.08), transparent 55%),
          var(--panel-strong);
      }

      .source[data-disabled="true"] {
        cursor: default;
        opacity: 0.78;
      }

      .topline {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }

      .name {
        font-size: 15px;
        font-weight: 700;
        line-height: 1.25;
      }

      .meta {
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-soft);
        white-space: nowrap;
      }

      .note {
        margin-top: 4px;
        font-size: 12px;
        color: var(--text-soft);
      }

      .meter {
        margin-top: 10px;
        height: 9px;
        border-radius: 999px;
        background: var(--level-bg);
        overflow: hidden;
      }

      .meter-fill {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background:
          linear-gradient(90deg, rgba(77, 240, 165, 0.88), rgba(114, 210, 255, 0.92));
        box-shadow: 0 0 18px rgba(77, 240, 165, 0.34);
        transition: width 70ms linear;
      }

      .row {
        margin-top: 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .hint {
        font-size: 11px;
        color: var(--text-soft);
      }

      .empty {
        padding: 16px;
        border: 1px dashed var(--border);
        border-radius: 18px;
        color: var(--text-soft);
        font-size: 13px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div class="eyebrow">Input Source</div>
        <div class="title">Live microphone preview</div>
        <div class="subtitle">Speak normally. The meters show which input is actually receiving signal. Click a row to make it the active source.</div>
      </section>
      <section id="status" class="status">Opening microphone preview...</section>
      <section id="list" class="list" aria-live="polite"></section>
    </main>
    <script type="module" src="./input-source-renderer.mjs"></script>
  </body>
</html>
