<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' data: blob:; object-src 'none'; base-uri 'none'">
    <title>DicTray Overlay</title>
    <style>
      :root {
        --bg-top: rgba(10, 20, 33, 0.94);
        --bg-bottom: rgba(5, 10, 18, 0.9);
        --border: rgba(183, 227, 255, 0.18);
        --shadow: rgba(1, 4, 9, 0.42);
        --text-strong: #f5fbff;
        --text-soft: rgba(224, 237, 245, 0.78);
        --chip-bg: rgba(109, 198, 255, 0.14);
        --chip-text: #d7f4ff;
        --dot: #72d2ff;
        --glow: rgba(114, 210, 255, 0.3);
        --listen-level: 0;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        pointer-events: none;
        user-select: none;
        font-family: "Aptos", "Bahnschrift", "Segoe UI Variable Text", "Segoe UI", sans-serif;
        color: var(--text-strong);
      }

      body[data-phase="listening"] {
        --chip-bg: rgba(53, 214, 134, 0.15);
        --chip-text: #dbffed;
        --dot: #4df0a5;
        --glow: rgba(77, 240, 165, 0.34);
      }

      body[data-phase="processing"],
      body[data-phase="transcribing"] {
        --chip-bg: rgba(109, 198, 255, 0.14);
        --chip-text: #d7f4ff;
        --dot: #72d2ff;
        --glow: rgba(114, 210, 255, 0.3);
      }

      body[data-phase="rewriting"] {
        --chip-bg: rgba(255, 190, 96, 0.18);
        --chip-text: #fff0d0;
        --dot: #ffbf66;
        --glow: rgba(255, 191, 102, 0.32);
      }

      body[data-phase="pending_insert"] {
        --chip-bg: rgba(255, 128, 128, 0.18);
        --chip-text: #ffe1e1;
        --dot: #ff8f8f;
        --glow: rgba(255, 143, 143, 0.3);
      }

      body[data-phase="inserting"] {
        --chip-bg: rgba(166, 131, 255, 0.18);
        --chip-text: #eee5ff;
        --dot: #c3a7ff;
        --glow: rgba(195, 167, 255, 0.34);
      }

      body[data-phase="idle"][data-error="true"] {
        --chip-bg: rgba(255, 128, 128, 0.18);
        --chip-text: #ffe1e1;
        --dot: #ff8f8f;
        --glow: rgba(255, 143, 143, 0.3);
      }

      .overlay {
        width: 100%;
        height: 100%;
        padding: 0;
      }

      .card {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        overflow: clip;
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 10px;
        padding: 14px 16px 14px 16px;
        border: 1px solid var(--border);
        border-radius: 22px;
        background:
          radial-gradient(circle at top left, rgba(124, 225, 255, 0.16), transparent 46%),
          linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
        box-shadow:
          0 18px 32px var(--shadow),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(18px);
        opacity: 0;
        transform: translateY(6px) scale(0.985);
        transition: opacity 140ms ease, transform 180ms ease, box-shadow 90ms linear, background 90ms linear;
      }

      .card > * {
        position: relative;
        z-index: 1;
      }

      .card::before,
      .card::after {
        content: "";
        position: absolute;
        border-radius: inherit;
        pointer-events: none;
        z-index: 0;
        transition: transform 90ms linear, opacity 90ms linear, filter 90ms linear;
      }

      .card::before {
        top: -34%;
        left: -16%;
        width: 70%;
        height: 84%;
        background: radial-gradient(circle, rgb(77 240 165 / calc(0.04 + (var(--listen-level) * 0.28))), transparent 72%);
        filter: blur(calc(6px + (var(--listen-level) * 12px)));
        opacity: calc(0.45 + (var(--listen-level) * 0.45));
        transform: scale(calc(0.84 + (var(--listen-level) * 0.42))) translate3d(calc(var(--listen-level) * 8px), 0, 0);
      }

      .card::after {
        right: -18%;
        bottom: -46%;
        width: 68%;
        height: 88%;
        background: radial-gradient(circle, rgb(114 210 255 / calc(0.06 + (var(--listen-level) * 0.18))), transparent 70%);
        filter: blur(calc(10px + (var(--listen-level) * 14px)));
        opacity: calc(0.38 + (var(--listen-level) * 0.34));
        transform: scale(calc(0.88 + (var(--listen-level) * 0.34))) translate3d(calc(var(--listen-level) * -10px), calc(var(--listen-level) * -8px), 0);
      }

      body[data-visible="true"] .card {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      body[data-phase="listening"] .card {
        animation: listeningGlow 4.8s ease-in-out infinite;
      }

      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-width: 0;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 auto;
        width: fit-content;
        max-width: 100%;
        padding: 7px 11px;
        border-radius: 999px;
        background: var(--chip-bg);
        color: var(--chip-text);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
      }

      .dot {
        width: 8px;
        height: 8px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--dot);
        box-shadow: 0 0 0 6px var(--glow);
        animation: pulse 1.8s ease-in-out infinite;
      }

      .meta {
        min-width: 0;
        flex: 1 1 auto;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-soft);
        text-align: right;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .headline {
        font-size: 21px;
        line-height: 1.08;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: var(--text-strong);
        align-self: center;
      }

      .subline {
        align-self: end;
        min-width: 0;
        font-size: 12px;
        line-height: 1.2;
        letter-spacing: 0.02em;
        color: var(--text-soft);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(0.88);
        }
        50% {
          transform: scale(1.08);
        }
      }

      @keyframes listeningGlow {
        0%,
        100% {
          background-position: 0% 0%, 0% 0%;
        }
        50% {
          background-position: 4% -3%, 0% 0%;
        }
      }
    </style>
  </head>
  <body>
    <main class="overlay" aria-live="polite">
      <section class="card">
        <div class="topline">
          <div class="chip">
            <span class="dot" aria-hidden="true"></span>
            <span id="phase-chip">Idle</span>
          </div>
          <div id="meta" class="meta">DicTray</div>
        </div>
        <div id="headline" class="headline">Ready</div>
        <div id="subline" class="subline">Press the shortcut to start dictation.</div>
      </section>
    </main>
    <script type="module" src="./voice-renderer.mjs"></script>
  </body>
</html>
