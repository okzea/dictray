name: Release

# Push a tag to cut a release:
#   git tag v0.2.0 && git push origin v0.2.0
#
# Each platform is packaged on its own runner because every packager shells out
# to native tooling: dotnet on Windows, hdiutil and codesign on macOS.
#
# The builds are unsigned. Windows shows a SmartScreen prompt and macOS is
# blocked by Gatekeeper until the user right-click-Opens the app; the release
# notes below say so rather than leaving people to guess.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (for a dry run without tagging)'
        required: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build portable package
        run: node scripts/build-windows-package.mjs --archive
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/DicTray-windows-x64.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build DMG
        run: node scripts/build-macos-dmg.mjs --dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build archive
        run: node scripts/build-linux-package.mjs --archive
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## Install

            **Windows** — download the zip, extract anywhere, run `DicTray.cmd`.
            Windows will show a SmartScreen warning because the build is
            unsigned: choose **More info -> Run anyway**.

            **macOS** — open the DMG and drag DicTray to Applications. The build
            is not notarized, so the first launch needs **right-click -> Open**
            rather than a double-click.

            **Linux** — extract the archive and run `bin/dictray`.

            ## GPU acceleration (NVIDIA, Windows and Linux)

            The CUDA libraries are ~2 GB and are not bundled. To enable GPU
            transcription after installing:

                node scripts/setup-gpu-acceleration.mjs

            It detects the GPU, installs what CTranslate2 needs, verifies that
            inference actually works, and falls back to CPU if anything fails.

            Speech models download on first use.
